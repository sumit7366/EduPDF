{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h2><i class="fas fa-plus"></i> Add News</h2>
        <p>Create a new news update for the homepage</p>
    </div>

    <form method="POST" class="news-form">
        <div class="form-group">
            <label for="title">News Title *</label>
            <input type="text" id="title" name="title" required 
                   placeholder="Enter news title (e.g., 🎉 New Features Added)">
        </div>

        <div class="form-group">
            <label for="content">News Content *</label>
            <textarea id="content" name="content" rows="5" required 
                      placeholder="Enter detailed news content..."></textarea>
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_active" value="true" checked>
                <span class="checkmark"></span>
                Activate this news immediately
            </label>
            <small class="form-help">If unchecked, the news will be saved but not shown on the homepage</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Publish News
            </button>
            <a href="{{ url_for('manage_news') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>

<style>
.form-container {
    max-width: 700px;
    margin: 0 auto;
}

.form-header {
    text-align: center;
    margin-bottom: 2rem;
}

.form-header h2 {
    color: var(--text-primary);
    margin-bottom: 0.5rem;
}

.form-header p {
    color: var(--text-secondary);
}

.news-form {
    background: var(--card-bg);
    padding: 2rem;
    border-radius: 15px;
    border: 1px solid var(--border-color);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-primary);
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--surface-color);
    color: var(--text-primary);
    font-size: 1rem;
    transition: all 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-weight: normal;
}

.checkbox-label input[type="checkbox"] {
    width: auto;
}

.form-help {
    display: block;
    margin-top: 0.25rem;
    color: var(--text-muted);
    font-size: 0.8rem;
}

.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
    flex-wrap: wrap;
}
</style>
{% endblock %}
