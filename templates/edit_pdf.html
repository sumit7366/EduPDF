{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h2><i class="fas fa-edit"></i> Edit PDF</h2>
        <p>Update PDF information</p>
    </div>

    <form method="POST" class="pdf-form">
        <div class="pdf-preview">
            <div class="pdf-icon">
                <i class="fas fa-file-pdf"></i>
            </div>
            <div class="pdf-info">
                <h3>{{ pdf.original_filename }}</h3>
                <p>Subject: {{ pdf.subject_name }}</p>
                <p>Uploaded: {{ pdf.upload_date[:16] }}</p>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" 
                      placeholder="Enter a description for this PDF...">{{ pdf.description or '' }}</textarea>
            <small class="form-help">Describe the content of this PDF to help users</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Update PDF
            </button>
            <a href="{{ url_for('manage_pdfs') }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>

<style>
.pdf-preview {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.5rem;
    background: var(--surface-color);
    border-radius: 10px;
    margin-bottom: 2rem;
    border: 1px solid var(--border-color);
}

.pdf-icon {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: #e53e3e;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
}

.pdf-info h3 {
    margin-bottom: 0.5rem;
    color: var(--text-primary);
}

.pdf-info p {
    margin: 0.25rem 0;
    color: var(--text-secondary);
}
</style>
{% endblock %}
