{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h2>Login to EduPDF</h2>
        
        <!-- Always show Google login button -->
        <div class="social-login">
            <a href="{{ url_for('google_login') }}" class="btn btn-google">
                <i class="fab fa-google"></i>
                Continue with Google
            </a>
            <div class="divider">
                <span>or login with email</span>
            </div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ request.form.username }}" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>


        

        
        <div class="auth-links">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
            <!-- <p>Admin demo: <strong>admin / admin123</strong></p>
            <p>User demo: <strong>user / user123</strong></p> -->
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 2rem;
}

.auth-form {
    background: var(--card-bg);
    padding: 3rem;
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
    width: 100%;
    max-width: 450px;
    animation: slideUp 0.5s ease;
}

.auth-form h2 {
    text-align: center;
    margin-bottom: 2rem;
    color: var(--text-primary);
    font-weight: 600;
}

.btn-google {
    background: #db4437;
    color: white;
    width: 100%;
    justify-content: center;
    padding: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.3s ease;
}

.btn-google:hover {
    background: #c23321;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(219, 68, 55, 0.3);
}

.social-login {
    margin-bottom: 2rem;
}

.divider {
    text-align: center;
    margin: 1.5rem 0;
    position: relative;
    color: var(--text-muted);
}

.divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--border-color);
}

.divider span {
    background: var(--card-bg);
    padding: 0 1rem;
    font-size: 0.9rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-primary);
}

.form-group input {
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: var(--surface-color);
    color: var(--text-primary);
    font-size: 1rem;
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.btn-block {
    width: 100%;
    justify-content: center;
}

.auth-links {
    text-align: center;
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border-color);
}

.auth-links p {
    margin: 0.5rem 0;
    color: var(--text-secondary);
}

.auth-links a {
    color: var(--primary-color);
    text-decoration: none;
    font-weight: 600;
}

.auth-links a:hover {
    text-decoration: underline;
}

.auth-links strong {
    color: var(--primary-color);
    background: var(--surface-color);
    padding: 0.2rem 0.5rem;
    border-radius: 5px;
    font-size: 0.9rem;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 480px) {
    .auth-form {
        padding: 2rem 1.5rem;
        margin: 1rem;
    }
    
    .auth-container {
        padding: 1rem;
    }
}
</style>
{% endblock %}
