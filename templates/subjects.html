{% extends "base.html" %}

{% block content %}
<div class="subjects-container">
    <h2>{{ subject[1] }} - PDFs ({{ subject[2] }})</h2>
    <div class="pdfs-list">
        {% for pdf in pdfs %}
        <div class="pdf-card">
            <h4>{{ pdf[3] }}</h4>
            <p>Uploaded: {{ pdf[4] }}</p>
            <div class="pdf-actions">
                <a href="{{ url_for('view_pdf', pdf_id=pdf[0]) }}" class="btn btn-primary" target="_blank">View</a>
                <a href="{{ url_for('download_pdf', pdf_id=pdf[0]) }}" class="btn btn-secondary">Download</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
